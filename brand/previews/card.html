<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:IT;src:url(InterTight.ttf);font-weight:100 900}
@font-face{font-family:JBM;src:url(JetBrainsMono.ttf);font-weight:100 800}
html,body{margin:0}
.c{width:1280px;height:640px;box-sizing:border-box;padding:72px 80px 0;background:#0E1013;color:#fff;font-family:IT;position:relative;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center}
.top img{height:44px}
.url{font-family:JBM;font-size:24px;color:#8E929B;letter-spacing:.01em}
h1{margin:96px 0 0;font-weight:800;letter-spacing:-.045em;line-height:1;white-space:nowrap;font-size:132px}
p{margin:30px 0 0;font-size:38px;line-height:1.3;font-weight:500;color:#C9CCD2;max-width:1060px;letter-spacing:-.01em}
.stack{position:absolute;left:80px;bottom:64px;font-family:JBM;font-size:24px;color:#FF5A1F;letter-spacing:.02em}
.bar{position:absolute;left:0;right:0;bottom:0;height:12px;background:#FF5A1F}
</style></head><body><div class="c"><div class="top"><img src="ethlo-wordmark-small.svg"><span class="url"></span></div><h1></h1><p></p><div class="stack"></div><div class="bar"></div></div></body></html>
